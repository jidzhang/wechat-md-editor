<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公众号编辑器</title>
<style>
  :root {
    --ink: #1d1d1b;
    --ink-2: #55554f;
    --ink-3: #8b8b84;
    --line: #e5e5df;
    --line-soft: #efefe9;
    --bg: #fafaf7;
    --panel: #ffffff;
    --accent: #2f6f55;
    --accent-soft: #eef4f0;
    --warn: #a8641f;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex: none;
  }

  .brand {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    margin-right: 4px;
  }

  .brand small {
    display: block;
    font-size: 12px;
    font-weight: 400;
    color: var(--ink-3);
    letter-spacing: 0;
    margin-top: 2px;
  }

  .tools {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-left: auto;
  }

  button {
    font: inherit;
    font-size: 13px;
    color: var(--ink-2);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 6px 12px;
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }

  button:hover {
    border-color: #c9c9c1;
    color: var(--ink);
  }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
  }

  button.primary:hover {
    background: #28604a;
    border-color: #28604a;
    color: #fff;
  }

  button.ghost {
    border-color: transparent;
    background: transparent;
    padding: 6px 8px;
    color: var(--ink-3);
  }

  button.ghost:hover {
    color: var(--ink);
    background: var(--line-soft);
  }

  .field {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-3);
  }

  select, input[type="number"] {
    font: inherit;
    font-size: 12px;
    color: var(--ink-2);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 5px 6px;
    outline: none;
  }

  select:focus, input[type="number"]:focus {
    border-color: #b9b9b0;
  }

  input[type="color"] {
    width: 28px;
    height: 26px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: #fff;
    cursor: pointer;
  }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(320px, 1fr) minmax(360px, 460px);
    gap: 0;
    min-height: 0;
  }

  .pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }

  .pane-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 20px;
    font-size: 12px;
    color: var(--ink-3);
    background: var(--bg);
    border-bottom: 1px solid var(--line-soft);
    flex: none;
  }

  .pane-head strong {
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: 0.4px;
  }

  #editor {
    flex: 1;
    width: 100%;
    resize: none;
    border: 0;
    outline: none;
    padding: 20px 22px 60px;
    background: var(--panel);
    color: var(--ink);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 13.5px;
    line-height: 1.85;
    tab-size: 2;
  }

  .preview-pane {
    border-left: 1px solid var(--line);
    background: #f2f2ec;
  }

  #stage {
    flex: 1;
    overflow-y: auto;
    padding: 20px 20px 60px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .phone {
    width: 100%;
    max-width: 375px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .04);
    padding: 24px 20px 32px;
    overflow-wrap: break-word;
  }

  .hint {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    margin: 0;
    padding: 10px 20px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--warn);
    background: #fdf7ee;
    border-top: 1px solid #f0e3cd;
    flex: none;
  }

  .hint[hidden] { display: none; }

  .hint b { font-weight: 600; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translate(-50%, 12px);
    padding: 9px 18px;
    border-radius: 20px;
    background: rgba(29, 29, 27, .92);
    color: #fff;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 50;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  @media (max-width: 900px) {
    main {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .preview-pane {
      border-left: 0;
      border-top: 1px solid var(--line);
    }
    .brand small { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    公众号编辑器
    <small>Markdown 转公众号，复制带样式的正文</small>
  </div>

  <div class="tools">
    <label class="field">字号
      <select id="fontSize">
        <option value="15">15</option>
        <option value="16" selected>16</option>
        <option value="17">17</option>
        <option value="18">18</option>
      </select>
    </label>

    <label class="field">主色
      <input type="color" id="accent" value="#2f6f55">
    </label>

    <label class="field">链接
      <select id="linkMode">
        <option value="footnote" selected>文末编号</option>
        <option value="inline">括号内联</option>
        <option value="keep">保留可点</option>
      </select>
    </label>

    <label class="field"><input type="checkbox" id="hideH1"> 隐藏一级标题</label>
    <label class="field"><input type="checkbox" id="followScroll" checked> 跟随滚动</label>

    <button class="ghost" id="loadSample" title="载入示例">示例</button>
    <button class="ghost" id="importBtn" title="导入 .md 文件">导入</button>
    <button class="ghost" id="exportBtn" title="下载 .md 文件">导出</button>
    <button class="primary" id="copyBtn">复制到公众号</button>
  </div>
</header>

<main>
  <section class="pane">
    <div class="pane-head">
      <strong>Markdown</strong>
      <span id="counter">0 字</span>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="在这里粘贴或撰写 Markdown……"></textarea>
  </section>

  <section class="pane preview-pane">
    <div class="pane-head">
      <strong>手机预览</strong>
      <span id="stats"></span>
    </div>
    <div id="stage">
      <article class="phone" id="preview"></article>
    </div>
    <p class="hint" id="hint" hidden></p>
  </section>
</main>

<input type="file" id="fileInput" accept=".md,.markdown,.txt" hidden>
<div class="toast" id="toast"></div>

<script src="vendor/marked.umd.js"></script>
<script src="src/renderer.js"></script>
<script src="src/app.js"></script>
</body>
</html>
